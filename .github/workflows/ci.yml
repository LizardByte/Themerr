---
name: CI
permissions: {}

env:
  PYTHON_VERSION: '3.14'

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  setup_release:
    name: Setup Release
    outputs:
      publish_release: ${{ steps.setup_release.outputs.publish_release }}
      release_body: ${{ steps.setup_release.outputs.release_body }}
      release_commit: ${{ steps.setup_release.outputs.release_commit }}
      release_generate_release_notes: ${{ steps.setup_release.outputs.release_generate_release_notes }}
      release_tag: ${{ steps.setup_release.outputs.release_tag }}
      release_version: ${{ steps.setup_release.outputs.release_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Release
        id: setup_release
        uses: LizardByte/actions/actions/release_setup@28374bf43cc8b6ee88b9b8a3419b2ac7a6573906  # v2026.928.123224
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  connector:
    name: Jellyfin Connector
    needs: setup_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Build Jellyfin connectors
        env:
          THEMERR_VERSION: ${{ needs.setup_release.outputs.release_version }}
        run: uv run --no-project --python ${{ env.PYTHON_VERSION }} scripts/build_connector.py

      - name: Check C# formatting
        run: |
          dotnet format connectors/jellyfin/Themerr.Connector.csproj --verify-no-changes --no-restore
          dotnet format connectors/jellyfin.tests/Connector.Tests.csproj --verify-no-changes

      - name: Test Jellyfin SDK baselines with coverage
        id: test
        run: uv run --no-project --python ${{ env.PYTHON_VERSION }} scripts/test_connector.py

      - name: Validate connector installation and ownership on Jellyfin servers
        env:
          THEMERR_VERSION: ${{ needs.setup_release.outputs.release_version }}
        run: uv run --locked --extra dev --python ${{ env.PYTHON_VERSION }} scripts/smoke_connector.py

      - name: Upload connector coverage
        if: >-
          always() &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure') &&
          startsWith(github.repository, 'LizardByte/')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          fail_ci_if_error: true
          files: ${{ steps.test.outputs.coverage_files }}
          flags: jellyfin-connector
          report_type: coverage
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload connector test results
        if: >-
          always() &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure') &&
          startsWith(github.repository, 'LizardByte/')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          fail_ci_if_error: true
          files: ${{ steps.test.outputs.test_files }}
          flags: jellyfin-connector
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload connector artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: jellyfin-connector
          path: jellyfin-connector/
          if-no-files-found: error

  build-docker:
    name: Docker
    needs: setup_release
    permissions:
      contents: read
      packages: write
    uses: LizardByte/.github/.github/workflows/__call-docker.yml@master
    with:
      docker_hub_username: ${{ vars.DOCKER_HUB_USERNAME }}
      gh_bot_name: ${{ vars.GH_BOT_NAME }}
      publish_release: ${{ needs.setup_release.outputs.publish_release }}
      release_commit: ${{ needs.setup_release.outputs.release_commit }}
      release_tag: ${{ needs.setup_release.outputs.release_tag }}
      release_version: ${{ needs.setup_release.outputs.release_version }}
    secrets:
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      GH_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs:
      - setup_release
      - connector
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: AMD64
          - os: windows-11-arm
            arch: ARM64
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Install Deno for YouTube support
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        with:
          deno-version: v2.9.8

      - name: Configure OpenSSL for Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'ARM64'
        shell: pwsh
        run: |
          # The runner includes Shining Light's ARM64 OpenSSL development package.
          $opensslDir = "$env:ProgramFiles/OpenSSL"
          $opensslLibDir = "$opensslDir/lib/VC/arm64/MD"

          if (-not (Test-Path -LiteralPath "$opensslDir/include/openssl/ssl.h") -or
              -not (Test-Path -LiteralPath "$opensslLibDir/libssl_static.lib") -or
              -not (Test-Path -LiteralPath "$opensslLibDir/libcrypto_static.lib")) {
            throw 'The runner is missing the ARM64 OpenSSL headers or static libraries.'
          }

          "OPENSSL_DIR=$opensslDir" >> $env:GITHUB_ENV
          "OPENSSL_LIB_DIR=$opensslLibDir" >> $env:GITHUB_ENV
          "OPENSSL_LIBS=libssl_static:libcrypto_static" >> $env:GITHUB_ENV
          "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Setup Python Dependencies
        env:
          UV_NO_BUILD: ${{ (matrix.os == 'windows-11-arm' || matrix.os == 'macos-15-intel') && 'false' || 'true' }}
        run: >-
          uv sync --locked --extra build --extra dev --no-install-project
          --no-python-downloads --python ${{ env.PYTHON_VERSION }}

      - name: Download Jellyfin connectors
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: jellyfin-connector
          path: jellyfin-connector/

      - name: Build and test web assets
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test

      - name: Set up virtual desktop
        if: runner.os == 'Linux'
        uses: LizardByte/actions/actions/virtual_desktop@28374bf43cc8b6ee88b9b8a3419b2ac7a6573906
        with:
          environment: fluxbox

      - name: Test with pytest
        id: test
        run: uv run --locked --no-build --no-sync python -m pytest

      - name: Upload coverage
        if: >-
          always() &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure') &&
          startsWith(github.repository, 'LizardByte/')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          fail_ci_if_error: true
          files: ./coverage/python-coverage.xml
          flags: "${{ runner.os }}-${{ matrix.arch }}"
          report_type: coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload test results
        if: >-
          always() &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure') &&
          startsWith(github.repository, 'LizardByte/')
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          fail_ci_if_error: true
          files: ./junit-python.xml
          flags: "${{ runner.os }}-${{ matrix.arch }}"
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && needs.setup_release.outputs.publish_release == 'true'
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c  # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_PASSWORD }}

      - name: Validate macOS signing identity
        if: runner.os == 'macOS' && needs.setup_release.outputs.publish_release == 'true'
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: test -n "${APPLE_CODESIGN_IDENTITY}"

      - name: Build pyinstaller package
        env:
          THEMERR_VERSION: ${{ needs.setup_release.outputs.release_version }}
          THEMERR_PREBUILT_CONNECTOR: '1'
          APPLE_CODESIGN_IDENTITY: >-
            ${{ runner.os == 'macOS' && needs.setup_release.outputs.publish_release == 'true'
            && secrets.APPLE_CODESIGN_IDENTITY || '' }}
        run: uv run --locked --no-build --no-sync python ./scripts/build.py

      - name: Verify macOS signature
        if: runner.os == 'macOS' && needs.setup_release.outputs.publish_release == 'true'
        run: codesign --verify --deep --strict --verbose=2 ./dist/themerr.app

      - name: Sign Windows executable
        # The signing action does not support ARM64 Windows runners.
        if: >-
          runner.os == 'Windows' && matrix.arch == 'AMD64' &&
          needs.setup_release.outputs.publish_release == 'true' && vars.AZURE_SIGNING_ACCOUNT != ''
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          files: ${{ github.workspace }}/dist/themerr.exe
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}

      - name: Verify Windows signature
        if: >-
          runner.os == 'Windows' && matrix.arch == 'AMD64' &&
          needs.setup_release.outputs.publish_release == 'true' && vars.AZURE_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath ./dist/themerr.exe
          if ($signature.Status -ne 'Valid') {
            throw "Windows executable signature is invalid: $($signature.Status)"
          }

      - name: Smoke test executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./dist/themerr.exe --help
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            ./dist/themerr.app/Contents/MacOS/themerr --help
          else
            ./dist/themerr --help
          fi

      - name: Package Release
        run: |
          7z a "./Themerr_${{ runner.os }}_${{ matrix.arch }}.zip" "dist"

          mkdir artifacts
          mv "./Themerr_${{ runner.os }}_${{ matrix.arch }}.zip" ./artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Themerr_${{ runner.os }}_${{ matrix.arch }}
          if-no-files-found: error  # 'warn' or 'ignore' are also available, defaults to `warn`
          path: |
            ${{ github.workspace }}/artifacts

  release:
    name: Create GitHub Release
    needs:
      - setup_release
      - build
    if: ${{ needs.setup_release.outputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: Themerr_*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: LizardByte/actions/actions/release_create@28374bf43cc8b6ee88b9b8a3419b2ac7a6573906  # v2026.928.123224
        with:
          allowUpdates: false
          body: ${{ needs.setup_release.outputs.release_body }}
          generateReleaseNotes: ${{ needs.setup_release.outputs.release_generate_release_notes }}
          name: ${{ needs.setup_release.outputs.release_tag }}
          prerelease: true
          tag: ${{ needs.setup_release.outputs.release_tag }}
          token: ${{ secrets.GH_BOT_TOKEN }}
          virustotal_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
